# Paths are relative to this file, so the run works from any working directory.
catchment:
  name: Coello
  start: "2009-01-01"
  end: "2009-01-10"
  spatial_resolution: distributed
  temporal_resolution: daily
  routing_method: muskingum

# One file per rainfall product, each holding all three drivers with the calendar inside it.
meteo:
  source: netcdf
  path: ../../data/distributed_model/meteo.nc
  precipitation: precipitation
  temperature: temperature
  evapotranspiration: evapotranspiration

flow_network:
  flow_accumulation: ../../data/distributed_model/GIS/acc4000.tif
  flow_direction: ../../data/distributed_model/GIS/fd4000.tif

parameters:
  path: ../../data/distributed_model/Parameter set-Avg
  snow: false
  maxbas: false

conceptual_model:
  model_class: HBVBergestrom92
  catchment_area: 1530
  initial_condition: [0, 5, 5, 5, 0]

gauges:
  table: ../../data/distributed_model/stations/gauges.csv
  discharge: ../../data/distributed_model/stations
  column: id
  fmt: "%Y-%m-%d"

# Written beside the other example outputs rather than into the repository root.
outputs:
  results_dir: ../../data/distributed_model/results
