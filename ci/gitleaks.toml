# Gitleaks configuration for the local gitleaks pre-commit hook. gitleaks is
# the repo's single secret scanner. This keeps gitleaks' full built-in ruleset
# and only allowlists paths that are registries or fixtures rather than source
# secrets.
title = "hapi"

[extend]
useDefault = true

[allowlist]
description = "Non-source paths: working notes and lockfile hashes"
paths = [
  # Planning / review notes are working documents, not shipped code.
  '''(^|/)planning/''',
  # The dependency lockfile is package hashes, not credentials.
  '''pixi\.lock$''',
]
