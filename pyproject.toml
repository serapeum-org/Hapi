[project]
name = "hapi-nile"
version = "1.7.0"
description = "Distributed hydrological-model"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "Mostafa Farrag", email = "moah.farag@gmail.com" }
]
license = {text = "GNU General Public License v3"}
keywords = ["Hydrology", "Distributed hydrological model"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
]

requires-python = ">= 3.11, <4"

dependencies = [
    "geopandas >=1.0.1",
    "loguru >=0.7.2",
    "numpy >=2.1.3",
    "pandas >=3.0.0",
    "PyYAML >=6.0.2",
    # GDAL is vendored inside the pyramids-gis wheel — do not pin gdal directly.
    "pyramids-gis >=0.46.0",
    "requests >=2.31.0",
    "scipy >=1.17.0",
    "serapeum-utils >=0.2.0",
    "statista >=0.8.0",
    "Oasis-Optimization >=1.0.3",
    "cleopatra >=0.26.1",
    "matplotlib >=3.11.0"
]

[dependency-groups]
dev = [
    "nbval >=0.11.0",
    "pre-commit >=3.7.1",
    "pre-commit-hooks >=4.6.0",
    "pytest >=8.2.2",
    "pytest-cov >= 6.0.0",
    "pytest-env >=1.6.0",
    "pytest-mock >=3.12.0",
    "pytest-timeout >=2.3.0",
    "coverage",
    "build >=1.0.0",
    "twine >=5.0.0",
    "pip",
    "jupyterlab",
    "notebook",
    "jupyter",
    "commitizen >=4.8.4",
    "mypy >=1.10.0",
    "types-PyYAML >=6.0.0"
]

docs = [
    "mkdocs >=1.5.3",
    "mkdocs-material >=9.5.3",
    "mkdocstrings >=0.24.0",
    "mkdocstrings-python >=1.7.5",
    "mike >=2.1.3",
    "mkdocs-jupyter >=0.25.1",
    "mkdocs-autorefs >=1.2",
    "mkdocs-macros-plugin >=1.3.7",
    "mkdocs-table-reader-plugin >=3.1.0",
    "mkdocs-mermaid2-plugin >=1.2.1",
    "jupyter-contrib-nbextensions >=0.7.0",
    "mkdocs-panzoom-plugin",
    "notebook <7.0"
]

[project.urls]
homepage = "https://github.com/serapeum-org/Hapi"
repository = "https://github.com/serapeum-org/Hapi"
documentation = "https://serapeum-org.github.io/Hapi"
Changelog = "https://github.com/serapeum-org/Hapi/blob/main/docs/change-log.md"

[project.scripts]
download-parameters = "hapi.parameters.parameters:main"
download-parameter-set = "hapi.parameters.parameters:main"
list-parameter-names = "hapi.parameters.parameters:main"


[build-system]
requires = ["setuptools>=80.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]

[tool.setuptools.packages.find]
where = ["src"]
include = ["hapi", "hapi.*"]

[tool.setuptools.package-data]
hapi = ["*.yaml", "include/gdal/*.h"]

# Ruff replaces black + isort + flake8 with one tool. Because a single engine
# formats and sorts imports against one line-length, the formatter and the
# import sorter cannot disagree the way black and isort did. Ruff lints and
# formats both .py and .ipynb natively.
[tool.ruff]
line-length = 88
target-version = "py311"  # requires-python floors at 3.11

[tool.ruff.format]
# black had skip-string-normalization = true → preserve existing quotes.
quote-style = "preserve"

[tool.ruff.lint]
# The old flake8 select was E/F/W (B and T4 were inert: flake8-bugbear /
# flake8-print were never installed). Add I (isort) and UP (pyupgrade) to fold
# in the standalone isort hook and modern-typing upgrades.
select = ["E", "F", "W", "I", "UP"]
# Mirror the old [tool.flake8].ignore. W503 is dropped — ruff does not
# implement it (formatter-owned pycodestyle code black conflicted with).
ignore = ["E203", "E226", "E266", "E501", "E701", "E722", "C901", "E741", "E731"]

[tool.ruff.lint.per-file-ignores]
# flake8 excluded examples/ and tests/ from linting — drop E/F/W and UP there,
# keeping only import-sorting (I), which isort did run everywhere. This keeps
# the migration's lint churn on shipped src/.
"tests/**" = ["E", "F", "W", "UP"]
"examples/**" = ["E", "F", "W", "UP"]
# Tutorial notebooks import next to first use and run setup before imports —
# both legitimately trip E402, which stays enforced for real modules.
"*.ipynb" = ["E402"]

[tool.bandit]
exclude_dirs = ["tests", "examples", "docs", "planning"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src/hapi"]

[tool.coverage.report]
show_missing = true
# Current branch coverage is ~52%; the floor locks that level in so it can only
# move up. Raise it as coverage improves.
fail_under = 50

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "$version"
changelog_file = "docs/change-log.md"
update_changelog_on_bump = true
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.mypy]
# Checker target is 3.12 even though `requires-python` floors at 3.11: numpy
# ships PEP 695 `type` statements in its stubs, which mypy only parses when the
# target is >= 3.12. This only widens the *typing* target; actual 3.11 runtime
# compatibility is covered by the py311 leg of the test matrix, not by mypy.
python_version = "3.12"
mypy_path = "src"
packages = ["hapi"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = false
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "examples/",
    "docs/",
    "planning/",
]

[[tool.mypy.overrides]]
module = [
    "hapi.catchment",
    "hapi.run",
    "hapi.calibration",
    "hapi.wrapper",
]
# These modules use a builder pattern: attributes are typed X | None in
# __init__ and populated by separate read_*() methods before use. Methods
# assume attributes are non-None but mypy cannot verify call order.
# Fix: add assert-based narrowing helpers (e.g. _require_spatial_data())
# that return non-None types, then remove these suppressions one by one.
# Error count without overrides: ~257 across these 4 modules.
disable_error_code = [
    "union-attr",    # .attr on X | None (159 sites)
    "attr-defined",  # .attr on None (11 sites)
    "arg-type",      # passing X | None where X expected (13 sites)
    "misc",          # slice index, None not callable (13 sites)
    "operator",      # arithmetic on X | None (4 sites)
    "index",         # indexing X | None (2 sites)
    "call-overload", # numpy overload mismatches on X | None (2 sites)
]

[[tool.mypy.overrides]]
module = "hapi.rrm.base_model"
disable_error_code = ["empty-body"]


[tool.pytest.ini_options]
env = [
    "MPLBACKEND=Agg",
    # D: sets the value only when the variable is not already set, so an
    # explicitly exported HAPI_DATA_DIR still wins over this default.
    "D:HAPI_DATA_DIR=src/hapi/parameters",
]
pythonpath = ["src"]
testpaths = ["tests"]
# Fail (don't hang) on a stuck test: pytest-timeout aborts any single test that
# runs longer than `timeout` and prints its stack; `faulthandler_timeout`
# (stdlib) dumps an earlier all-thread traceback for diagnosis.
timeout = 300
faulthandler_timeout = 120
markers = [
    "vfs: mark a test as a virtual file system (deselect with '-m \"not vfs\"')",
    "slow: mark test as slow (deselect with '-m \"not slow\"')",
    "fast: mark test as fast (deselect with '-m \"not fast\"')",
    "plot: test plotting function optional package (deselect with '-m \"not plot\"')",
    "e2e: end-to-end test (deselect with '-m \"not e2e\"')",
    "mock: mock test (deselect with '-m \"not mock\"')",
    "integration: integration test (deselect with '-m \"not integration\"')",
    "fig_share: FigShare API test (deselect with '-m \"not fig_share\"')"
]


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
hapi-nile = { path = ".", editable = true }

[tool.pixi.tasks]
main = { cmd = "pytest -vvv --cov=src/hapi -sv -m 'not plot and not fig_share' --cov-report=xml", description = "Run the main test suite" }
plot = { cmd = "pytest -vvv --cov=src/hapi -sv -m 'plot' --cov-report=xml", description = "Run plot test suite" }
test-all = { cmd = "pytest -vvv --cov=src/hapi -sv -m 'not fig_share' --cov-report=xml --cov-report=term-missing", description = "Run all test suite" }
notebooks = { cmd = "pytest --nbval --nbval-lax --verbose examples", description = "Check notebooks (the examples notebooks still need migration off the pre-rename Hapi package)" }
build-dist = { cmd = "python -m build", description = "Build sdist and wheel for PyPI" }
publish-pypi = { cmd = "twine upload --non-interactive --repository pypi dist/*", depends-on = ["build-dist"], description = "Build and upload package to PyPI" }
cz-changelog = { cmd = "cz changelog", description = "Generate changelog using Commitizen" }
cz-bump = { cmd = "cz bump", description = "Bump version using Commitizen" }
mypy = { cmd = "mypy", description = "Run mypy type checking" }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "docs" }
py311 = { features = ["py311", "dev"], solve-group = "py311" }
py312 = { features = ["py312", "dev"], solve-group = "py312" }
py313 = { features = ["py313", "dev"], solve-group = "py313" }

[tool.pixi.feature.py311.dependencies]
python = "3.11.*"
[tool.pixi.feature.py312.dependencies]
python = "3.12.*"
[tool.pixi.feature.py313.dependencies]
python = "3.13.*"
