name: Tests - Suite

permissions:
  contents: read
  id-token: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  main-package:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        environment: [py311, py312, py313]
    env:
      OS: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: serapeum-org/github-actions/actions/python-setup/pixi@38c111084f99d5ff5f4a1e63bedce48fe33a10c0  # pixi/v1.2.1
        with:
          environments: ${{ matrix.environment }}
          activate-environment: ${{ matrix.environment }}
          cache: true

      - name: Run Tests
        run: |
          pixi run -e ${{ matrix.environment }} test-all
        env:
          HAPI_DATA_DIR: ${{ github.workspace }}/src/hapi/parameters

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v5
